name: Build Chutki Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android Platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies & build dist
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Wrap with Capacitor Android & Configure Google Login
        run: |
          npm install --legacy-peer-deps @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          elif [ -f public/assets/aistudio/google-services_5c61c5de.json ]; then
            cp public/assets/aistudio/google-services_5c61c5de.json android/app/google-services.json
          fi
          node -e '
            const fs = require("fs");
            const varsPath = "android/variables.gradle";
            let vars = fs.readFileSync(varsPath, "utf8");
            if (!vars.includes("rgcfaIncludeGoogle")) {
              vars = vars.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true");
              fs.writeFileSync(varsPath, vars, "utf8");
            }
          '
          npx cap sync android

      - name: Add Mic, GPS & Notification Permissions to AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            const perms = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS"
            ];
            const toInsert = perms
              .filter(p => !xml.includes(p))
              .map(p => `    <uses-permission android:name="${p}" />`)
              .join("\n");
            if (toInsert) {
              xml = xml.replace("<application", `${toInsert}\n\n    <application`);
              fs.writeFileSync(path, xml, "utf8");
            }
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Print APK SHA-1 for Firebase Google Login
        run: |
          cd android
          ./gradlew signingReport --no-daemon | grep -E "Variant:|SHA1:|SHA-256:" | head -n 12 || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chutki-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
