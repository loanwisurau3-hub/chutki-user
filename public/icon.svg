<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chutkiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="55%" stop-color="#0c831f" />
      <stop offset="100%" stop-color="#065f17" />
    </linearGradient>
    <linearGradient id="boltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#chutkiBg)" />

  <!-- Subtle Glow Circle -->
  <circle cx="256" cy="256" r="196" fill="#ffffff" fill-opacity="0.06" />

  <!-- Modern Grocery Bag Handle -->
  <path
    d="M188 178 C188 124, 324 124, 324 178"
    fill="none"
    stroke="#ffffff"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Modern Grocery Bag Body -->
  <rect
    x="124"
    y="174"
    width="264"
    height="232"
    rx="44"
    fill="#ffffff"
  />

  <!-- Express Lightning Bolt inside Bag -->
  <path
    d="M276 206 L206 300 H256 L236 376 L312 276 H262 Z"
    fill="url(#boltGold)"
    stroke="#0c831f"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Top Right Speed Spark Dot -->
  <circle cx="388" cy="128" r="24" fill="url(#boltGold)" />
</svg>
